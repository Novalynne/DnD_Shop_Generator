[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-shop-generator"
version = "0.1.0"
description = "Generatore di negozi e oggetti per D&D"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "python-dotenv",
    "SQLAlchemy",
    "pytest",
    "pyinstaller",
    "PySide6",
]

[tool.setuptools.packages.find]
where = ["src"]